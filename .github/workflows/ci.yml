name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, migrations, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Publishable, client-side values only — no secrets are needed to build.
      VITE_SUPABASE_URL: https://mbqvgrfadxgvolkiyzlt.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_JIQHRuL6xazMVNN57Dc9_Q_pFMBDTMH
      VITE_SUPABASE_PROJECT_ID: mbqvgrfadxgvolkiyzlt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-modules-${{ hashFiles('package-lock.json') }}

      - name: Restore typecheck/lint/build cache
        id: tool-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules/.cache/tsc
            node_modules/.cache/eslint
            node_modules/.vite
          key: ${{ runner.os }}-node20-toolcache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node20-toolcache-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node20-toolcache-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Migration sanity checks
        run: npm run check:migrations

      # Slowest step last: cheap checks fail the PR before we pay for a build.
      - name: Production build
        run: npm run build

      - name: Save typecheck/lint/build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules/.cache/tsc
            node_modules/.cache/eslint
            node_modules/.vite
          key: ${{ runner.os }}-node20-toolcache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Unit and integration tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: warn
          retention-days: 14
