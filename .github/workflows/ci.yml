name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-modules-${{ hashFiles('package-lock.json') }}

      - name: Restore typecheck/lint cache
        id: tool-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules/.cache/tsc
            node_modules/.cache/eslint
          key: ${{ runner.os }}-node20-toolcache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node20-toolcache-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-node20-toolcache-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Migration sanity checks
        run: npm run check:migrations

      - name: Save typecheck/lint cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules/.cache/tsc
            node_modules/.cache/eslint
          key: ${{ runner.os }}-node20-toolcache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
